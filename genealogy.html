<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>家系図 | 歴史人物名鑑（試作）</title>
<meta name="description" content="日本の氏族・大名家の家系図を、地図のように拡大縮小しながらたどれるページ（試作）。">
<style>
:root{
  --bg:linear-gradient(180deg,#fbf9f3,#efe8d8);
  --ink:#22304d; --mut:#6d7484;
  --accent:#27436e; --accent-soft:rgba(39,67,110,.10);
  --panel:rgba(255,255,255,.88); --panel-line:rgba(39,67,110,.32);
  --node-bg:#fffdf6; --node-line:#33507e; --node-text:#22304d;
  --edge:rgba(39,67,110,.5);
  --highlight:#a37f36; --header-bg:rgba(250,248,242,.92);
  --crest-color:#27436e;
  --serif:"Hiragino Mincho ProN","Hiragino Mincho Pro","YuMincho","Yu Mincho","Noto Serif JP","MS PMincho",serif;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--bg); background-color:#f4efe2;
  min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; overflow-x:hidden;
  transition:background-color .8s ease, color .6s ease;
}
header, .card, button, input, aside, .zoomctl button, .hint{
  transition:background-color .8s ease, background .8s ease, color .6s ease, border-color .8s ease;
}
/* ===== ヘッダー ===== */
header{
  background:var(--header-bg); border-bottom:1px solid var(--panel-line);
  padding:10px 16px 12px; position:relative; z-index:30;
  backdrop-filter:blur(6px);
}
.hd-row{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; max-width:1400px; margin:0 auto}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand .crest{width:34px; height:34px; color:var(--accent); flex:none; transition:color .8s ease}
.brand .crest svg{width:100%; height:100%; display:block}
h1{font-family:var(--serif); font-size:24px; letter-spacing:.28em; margin:0; font-weight:600; white-space:nowrap}
.clan-desc{margin:2px 0 0; font-size:11.5px; color:var(--mut); letter-spacing:.04em}
.clan-tabs{display:flex; gap:6px; flex-wrap:wrap}
.clan-label{
  font-family:var(--serif); font-size:13px; letter-spacing:.18em; color:var(--mut);
  align-self:center; flex:none; margin-right:2px;
}
.clan-tabs button{
  font-family:var(--serif); font-size:15px; font-weight:600; letter-spacing:.14em;
  background:var(--panel); color:var(--ink); border:1.5px solid var(--accent);
  padding:8px 20px; border-radius:999px; cursor:pointer;
}
.clan-tabs button.on{background:var(--accent); color:#fff; border-color:var(--accent)}
html[data-clan="heike"] .clan-tabs button.on{color:#1c0a05}
.search{position:relative; margin-left:auto}
.search input{
  width:min(300px,72vw); padding:9px 13px; font-size:14px; font-family:var(--sans);
  background:var(--panel); color:var(--ink); border:1px solid var(--panel-line); border-radius:8px; outline:none;
}
.search input::placeholder{color:var(--mut)}
#candidates{
  position:absolute; top:calc(100% + 6px); right:0; width:min(320px,84vw); max-height:320px; overflow:auto;
  background:var(--panel); border:1px solid var(--panel-line); border-radius:10px; padding:5px; display:none; z-index:50;
  box-shadow:0 14px 34px rgba(0,0,0,.25);
}
#candidates button{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px; width:100%;
  background:transparent; border:0; border-radius:7px; padding:8px 10px; cursor:pointer; color:var(--ink); text-align:left;
}
#candidates button:hover{background:var(--accent-soft)}
#candidates .cn{font-family:var(--serif); font-size:14.5px}
#candidates .cm{font-size:11px; color:var(--mut); white-space:nowrap}
/* ===== レイアウト ===== */
main{flex:1; display:flex; gap:0; max-width:1400px; width:100%; margin:0 auto; min-height:0}
#stage{
  position:relative; flex:1; min-width:0; height:calc(100vh - 190px); height:calc(100dvh - 190px); min-height:480px; overflow:hidden;
}
#watermark{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  pointer-events:none; z-index:0; transition:color .8s ease, opacity .8s ease;
}
#watermark svg{width:min(58vh,480px); height:auto; display:block}
#canvas{position:absolute; inset:0; width:100%; height:100%; z-index:1; touch-action:none; cursor:grab}
#canvas:active{cursor:grabbing}
.zoomctl{position:absolute; left:calc(14px + env(safe-area-inset-left, 0px)); bottom:calc(14px + env(safe-area-inset-bottom, 0px)); z-index:5; display:flex; gap:6px}
.zoomctl button{
  min-width:42px; height:38px; padding:0 12px; font-size:16px; cursor:pointer;
  background:var(--panel); color:var(--ink); border:1px solid var(--panel-line); border-radius:9px;
}
.hint{
  position:absolute; right:calc(14px + env(safe-area-inset-right, 0px)); bottom:calc(14px + env(safe-area-inset-bottom, 0px)); z-index:5; font-size:11px; color:var(--mut);
  background:var(--panel); border:1px solid var(--panel-line); border-radius:999px; padding:5px 12px;
}
/* ===== 系図SVG ===== */
#edges path{stroke:var(--edge); fill:none; stroke-width:1.3; transition:stroke .8s ease}
#edges path.spouse{stroke-width:1.1}
.gen-label{font-family:var(--serif); font-size:12px; letter-spacing:.22em; fill:var(--mut); text-anchor:end; transition:fill .8s ease}
.node{cursor:pointer}
.node rect.card{fill:var(--node-bg); stroke:var(--node-line); stroke-width:1.2; transition:fill .8s ease, stroke .8s ease}
.node.sel rect.card{stroke:var(--highlight); stroke-width:2.4}
.node text{pointer-events:none}
.node .nm{font-family:var(--serif); font-size:14px; font-weight:600; fill:var(--node-text); transition:fill .8s ease}
.node .yr{font-size:10.5px; fill:var(--mut); transition:fill .8s ease}
.node .avc{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1; transition:fill .8s ease, stroke .8s ease}
.node .avt{font-family:var(--serif); font-size:12px; fill:var(--accent); text-anchor:middle; transition:fill .8s ease}
.hl-ring{fill:none; stroke:var(--highlight); stroke-width:2.6; pointer-events:none; animation:hlpulse 1.05s ease-in-out infinite}
@keyframes hlpulse{0%,100%{opacity:1}50%{opacity:.3}}
/* ===== 関係線・凡例 ===== */
#relations path{fill:none; stroke-width:1.2}
.rel-label{
  font-size:10px; pointer-events:none;
  paint-order:stroke; stroke:var(--panel); stroke-width:3.5px; stroke-linejoin:round;
}
#legend{
  position:absolute; left:calc(14px + env(safe-area-inset-left, 0px)); top:12px; z-index:6;
  background:var(--panel); border:1px solid var(--panel-line); border-radius:10px;
  padding:8px 12px 9px; font-size:11px; line-height:1.5; color:var(--ink); max-width:230px;
}
#legend .lg-title{font-family:var(--serif); font-size:11.5px; letter-spacing:.14em; color:var(--mut); cursor:pointer; background:none; border:0; padding:0; font-weight:600}
#legend ul{list-style:none; margin:5px 0 0; padding:0}
#legend li{display:flex; align-items:center; gap:8px; margin:2.5px 0}
#legend svg{flex:none}
#legend.closed ul{display:none}
/* ===== 詳細パネル ===== */
aside{
  width:330px; flex:none; border-left:1px solid var(--panel-line); background:var(--panel);
  padding:18px 18px 24px; overflow:auto; max-height:calc(100vh - 190px); max-height:calc(100dvh - 190px);
}
aside h2{font-family:var(--serif); font-size:21px; letter-spacing:.1em; margin:0 0 2px}
aside .ttl{font-size:12px; color:var(--accent); letter-spacing:.12em; margin:0 0 10px}
aside .avatar{
  width:74px; height:74px; border-radius:50%; margin:4px 0 12px;
  border:1.5px solid var(--accent); background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  font-family:var(--serif); font-size:30px;
}
aside .avatar img{width:100%; height:100%; object-fit:cover}
aside h2 .kana{font-size:12.5px; color:var(--mut); letter-spacing:.05em; font-weight:400}
.drow{display:flex; gap:10px; padding:7.5px 0; border-bottom:1px solid var(--panel-line); font-size:13.5px; line-height:1.55}
.drow b{flex:none; width:70px; font-family:var(--serif); font-weight:600; color:var(--mut); letter-spacing:.06em}
.drow .v{min-width:0}
.drow a{color:var(--accent)}
.rel{
  background:none; border:0; padding:0; font:inherit; color:var(--accent); cursor:pointer;
  text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--panel-line);
}
.intro-crest{width:64px; height:64px; color:var(--accent); margin:2px 0 10px; transition:color .8s ease}
.intro-crest svg{width:100%; height:100%; display:block}
aside p.note{font-size:13px; line-height:1.8; color:var(--ink)}
aside p.sub{font-size:12px; color:var(--mut); line-height:1.7}
aside h3{font-family:var(--serif); font-size:13.5px; letter-spacing:.12em; color:var(--mut); margin:16px 0 6px; font-weight:600}
.drow .src, .relsec .src{color:var(--mut); font-size:11px}
.relsec .ritem{padding:5px 0; border-bottom:1px solid var(--panel-line); font-size:13px; line-height:1.55}
.relsec .tag{
  display:inline-block; font-size:10px; letter-spacing:.06em; padding:0 6px; margin-left:6px;
  border:1px solid var(--panel-line); border-radius:999px; color:var(--mut); vertical-align:1px; white-space:nowrap;
}
.altsec .aitem{
  border-left:3px solid var(--mut); padding:5px 0 5px 10px; margin:7px 0;
  font-size:12.5px; line-height:1.7;
}
.altsrc{
  display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.05em; color:#fff;
  padding:0 7px; border-radius:999px; margin-right:7px; vertical-align:1px; white-space:nowrap;
}
/* ===== フッター ===== */
footer{
  border-top:1px solid var(--panel-line); padding:12px 16px calc(16px + env(safe-area-inset-bottom, 0px)); text-align:center;
  font-size:11px; color:var(--mut); line-height:1.8; background:var(--header-bg);
}
@media (max-width:820px){
  header{padding:8px 12px 10px}
  .hd-row{gap:8px 10px}
  .brand .crest{width:28px; height:28px}
  h1{font-size:20px}
  .clan-desc{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .clan-tabs{order:1; flex:1 1 100%; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:2px}
  .clan-tabs::-webkit-scrollbar{display:none}
  .clan-tabs button{flex:none}
  .search{order:2; flex:1 1 100%; margin-left:0}
  .search input{width:100%}
  #candidates{left:0; right:0; width:auto}
  main{flex-direction:column}
  #stage{height:62vh; height:62dvh; min-height:420px; flex:none}
  aside{width:auto; border-left:0; border-top:1px solid var(--panel-line); max-height:none}
}
</style>
</head>

      <span class="crest" id="brandCrest"></span>
      <div>

        <p class="clan-desc" id="clanDesc"></p>
      </div>
    </div>
    <nav class="clan-tabs" id="clanTabs" aria-label="家系の選択"><span class="clan-label">家系</span></nav>
    <div class="search">
      <input id="searchInput" type="text" placeholder="名前で検索（例：義経、よしつね）" autocomplete="off">
      <div id="candidates"></div>
    </div>
  </div>
</header>
<main>
  <section id="stage">
    <div id="watermark"></div>
    <svg id="canvas" aria-label="家系図キャンバス">
      <g id="viewport">
        <g id="edges"></g>
        <g id="relations"></g>
        <g id="genlabels"></g>
        <g id="nodes"></g>
      </g>
    </svg>
    <div class="zoomctl">
      <button id="zin" type="button" title="拡大">＋</button>
      <button id="zout" type="button" title="縮小">−</button>
      <button id="zfit" type="button" title="全体表示">全体</button>
    </div>
    <div id="legend" hidden></div>
    <div class="hint">ドラッグで移動／ホイール・ピンチで拡大縮小</div>
  </section>
  <aside id="detail"></aside>
</main>

function relStyleOf(r){
  if (r.sourceAlt) return {cls:"rel-alt", color:altColor(r.sourceAlt), dash:"5 3", label:true, arrow:false};
  if (r.kind === "lineage") return {cls:"rel-lineage", color:"#a07c2c", dash:"8 4", label:true, arrow:false};
  if (r.kind === "sequence") return {cls:"rel-sequence", color:"#5b7aa5", dash:"1.5 4", label:false, arrow:true};
  if (r.kind === "identity") return {cls:"rel-identity", color:"#a07c2c", dash:"6 3 1.5 3", label:true, arrow:false};

}
function isSpouseOnly(m){ if (byId[m.father] || byId[m.mother]) return false; return (m.spouses || []).some(function(s){ return !!byId[s]; }); }
function leadIdOf(m){ if (!isSpouseOnly(m)) return m.id; for (var i = 0; i < m.spouses.length; i++){ if (byId[m.spouses[i]]) return m.spouses[i]; } return m.id; }

var THEME_MAP = {bg:"--bg", ink:"--ink", mut:"--mut", accent:"--accent", accentSoft:"--accent-soft", panel:"--panel", panelLine:"--panel-line", nodeBg:"--node-bg", nodeLine:"--node-line", nodeText:"--node-text", edge:"--edge", highlight:"--highlight", headerBg:"--header-bg", crestColor:"--crest-color"};

  for (var k in THEME_MAP) root.setProperty(THEME_MAP[k], t[k]);
  document.body.style.backgroundColor = t.bgc;
  var wm = document.getElementById("watermark");
  wm.style.color = t.crestColor; wm.style.opacity = t.crestOpacity; wm.innerHTML = crestSVG(t.crest);
  document.getElementById("brandCrest").innerHTML = crestSVG(t.crest);
  document.documentElement.dataset.clan = clan.id;
}

var floatIds = {}; /* id -> level（系譜に繋げずキャンバス上部に浮かせる柱） */
var unitOf = {}; /* memberId -> その人が属するユニットのリードid */
function buildLayout(){
  byId = {}; units = {}; kidsOf = {}; genOfMap = {}; pos = {}; floatIds = {}; unitOf = {};
  clan.members.forEach(function(m){ byId[m.id] = m; });
  (clan.floaters || []).forEach(function(f){ floatIds[f.id] = f.level; });
  function makeUnit(m){
    var partners = (m.spouses || []).filter(function(s){ return byId[s] && isSpouseOnly(byId[s]) && unitOf[s] == null; }).map(function(s){ return byId[s]; });
    units[m.id] = {lead:m, partners:partners, w:0, anchorX:0, cx:0};
    kidsOf[m.id] = [];
    unitOf[m.id] = m.id;
    partners.forEach(function(p){ unitOf[p.id] = m.id; });
  }
  clan.members.forEach(function(m){
    if (floatIds[m.id] != null || isSpouseOnly(m)) return;
    makeUnit(m);
  });
  /* 両方とも親を持たない夫婦（天宇受売命と猿田毘古神、饒速日命と登美夜毘売など）は
     どちらもリードになれず取り残される。残った配偶者のみメンバーをリードに昇格させて救済する */
  clan.members.forEach(function(m){
    if (floatIds[m.id] != null || !isSpouseOnly(m) || unitOf[m.id] != null) return;
    makeUnit(m);
  });
  /* 子は親ユニットのどちらか一方にだけ付ける。両親が別ユニットの神々で
     二重配置にならないようにするためで、父方を優先し、父がいなければ母方にする。
     もう一方の親との繋がりは詳細パネルの父・母欄から辿れる */
  clan.members.forEach(function(m){
    if (floatIds[m.id] != null || isSpouseOnly(m)) return;
    var chosen = null;
    [m.father, m.mother].forEach(function(p){
      if (chosen || !p) return;
      var L = unitOf[p];

  Object.keys(kidsOf).forEach(function(k){
    kidsOf[k].sort(function(a, b){ return ((a.byear == null ? 9999 : a.byear) - (b.byear == null ? 9999 : b.byear)) || a.name.localeCompare(b.name, "ja"); });
  });
  function gen(id){
    if (genOfMap[id] != null) return genOfMap[id];
    genOfMap[id] = 0;
    var m = byId[id], gs = [];
    [m.father, m.mother].forEach(function(p){ var L = p && unitOf[p]; if (L && L !== id) gs.push(gen(L)); });
    genOfMap[id] = gs.length ? Math.max.apply(null, gs) + 1 : 0;
    return genOfMap[id];
  }
  Object.keys(units).forEach(function(id){ gen(id); });
  function ownW(u){ return NW + u.partners.length * (SPG + NW); }

    var u = units[id], ks = kidsOf[id];

    var kw = 0; ks.forEach(function(c, i){ kw += width(c.id) + (i ? HGAP : 0); });
    u.w = Math.max(ownW(u), kw); return u.w;
  }

    var u = units[id], y = genOfMap[id] * ROWH, ow = ownW(u), lx = left + (u.w - ow) / 2;

    u.partners.forEach(function(p, i){ pos[p.id] = {x: lx + NW + SPG + i * (NW + SPG), y:y}; });
    u.anchorX = lx + ow / 2; u.cx = left + u.w / 2;
    var ks = kidsOf[id];
    if (ks.length){
      var kw = 0; ks.forEach(function(c, i){ kw += units[c.id].w + (i ? HGAP : 0); });
      var kx = u.cx - kw / 2;
      ks.forEach(function(c){ place(c.id, kx); kx += units[c.id].w + HGAP; });

  var roots = Object.keys(units).filter(function(id){ return !isChild[id]; });
  roots.sort(function(a, b){ return ((byId[a].byear == null ? 9999 : byId[a].byear) - (byId[b].byear == null ? 9999 : byId[b].byear)) || byId[a].name.localeCompare(byId[b].name, "ja"); });
  var totalW = 0; roots.forEach(function(id){ totalW += width(id); });
  totalW += HGAP * Math.max(0, roots.length - 1);
  var rx = 0; roots.forEach(function(id){ place(id, rx); rx += units[id].w + HGAP; });

  /* 系譜に繋げない柱（天之御中主神・アメミヲヤなど）はキャンバスの一番上に浮かせる。
     level が大きいほど上（外側）に置く */
  var fl = clan.floaters || [];
  if (fl.length){
    var levels = {};
    fl.forEach(function(f){ (levels[f.level] = levels[f.level] || []).push(f.id); });
    Object.keys(levels).forEach(function(lv){
      var ids = levels[lv].filter(function(id){ return byId[id]; });
      if (!ids.length) return;
      var rowW = ids.length * NW + (ids.length - 1) * HGAP;
      var sx = Math.max(0, (totalW - rowW) / 2);
      var y = -Number(lv) * (ROWH + 30) - 16;
      ids.forEach(function(id, i){ pos[id] = {x: sx + i * (NW + HGAP), y: y}; });
      contentBox.minY = Math.min(contentBox.minY, y - 16);
    });
  }
}

function render(){
  var edges = document.getElementById("edges"), nodes = document.getElementById("nodes"), gl = document.getElementById("genlabels");
  var relsG = document.getElementById("relations");
  edges.innerHTML = ""; nodes.innerHTML = ""; gl.innerHTML = ""; relsG.innerHTML = "";
  var oldDefs = document.getElementById("avdefs"); if (oldDefs) oldDefs.remove();
  var defs = el("defs", {id:"avdefs"});
  var cp = el("clipPath", {id:"avclip", clipPathUnits:"userSpaceOnUse"});
  cp.appendChild(el("circle", {cx:19, cy:NH/2, r:11.5}));
  defs.appendChild(cp);
  var mk = el("marker", {id:"seqArrow", viewBox:"0 0 10 10", refX:8.5, refY:5, markerWidth:6.5, markerHeight:6.5, orient:"auto-start-reverse"});
  mk.appendChild(el("path", {d:"M 0 0 L 10 5 L 0 10 z", fill:"#5b7aa5"}));
  defs.appendChild(mk);
  canvas.insertBefore(defs, canvas.firstChild);
  var gens = {};
  Object.keys(units).forEach(function(id){ gens[genOfMap[id]] = 1; });
  Object.keys(gens).forEach(function(g){
    var t = el("text", {x:-16, y: Number(g) * ROWH + NH/2 + 4, "class":"gen-label"});
    t.textContent = "第" + (Number(g) + 1) + "代";
    gl.appendChild(t);
  });
  Object.keys(units).forEach(function(id){
    var u = units[id], lp = pos[u.lead.id];
    u.partners.forEach(function(p){
      var pp = pos[p.id];
      [-2.6, 2.6].forEach(function(off){
        edges.appendChild(el("path", {d:"M " + (lp.x + NW) + " " + (lp.y + NH/2 + off) + " L " + pp.x + " " + (pp.y + NH/2 + off), "class":"spouse"}));
      });
    });
    var ks = kidsOf[id];
    if (ks.length){
      var busY = lp.y + NH + VGAP/2;
      var xs = ks.map(function(c){ return pos[c.id].x + NW/2; });
      var lo = Math.min.apply(null, xs.concat([u.anchorX])), hi = Math.max.apply(null, xs.concat([u.anchorX]));
      var d = "M " + u.anchorX + " " + (lp.y + NH) + " L " + u.anchorX + " " + busY
            + " M " + lo + " " + busY + " L " + hi + " " + busY;
      xs.forEach(function(x, i){ d += " M " + x + " " + busY + " L " + x + " " + pos[ks[i].id].y; });
      edges.appendChild(el("path", {d:d}));
    }
  });
  /* 関係線（relations）：種類と出典で描き分ける。線の意味は凡例と詳細パネルの「関係」欄に出す */
  (clan.relations || []).forEach(function(r){
    var p1 = pos[r.from], p2 = pos[r.to];
    if (!p1 || !p2) return;
    var st = relStyleOf(r);
    var x1 = p1.x + NW/2, y1 = p1.y + NH/2, x2 = p2.x + NW/2, y2 = p2.y + NH/2;
    var mx = (x1 + x2)/2, my = (y1 + y2)/2;
    var dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
    var off = Math.min(46, Math.max(14, len * 0.14));
    var cx = mx + (-dy / len) * off, cy = my + (dx / len) * off;
    var path = el("path", {d:"M " + x1 + " " + y1 + " Q " + cx + " " + cy + " " + x2 + " " + y2, "class":st.cls, stroke:st.color});
    if (st.dash) path.setAttribute("stroke-dasharray", st.dash);
    if (st.arrow) path.setAttribute("marker-end", "url(#seqArrow)");
    relsG.appendChild(path);
    if (st.label && r.label){
      var t = el("text", {"class":"rel-label", x:(0.25 * x1 + 0.5 * cx + 0.25 * x2).toFixed(1), y:(0.25 * y1 + 0.5 * cy + 0.25 * y2 - 3).toFixed(1), "text-anchor":"middle", fill:st.color});
      t.textContent = r.label;
      relsG.appendChild(t);
    }
  });
  clan.members.forEach(function(m){
    var p = pos[m.id]; if (!p) return;
    var g = el("g", {"class":"node" + (m.id === selectedId ? " sel" : ""), transform:"translate(" + p.x + "," + p.y + ")", "data-id":m.id});
    g.appendChild(el("rect", {"class":"card", x:0, y:0, width:NW, height:NH, rx:7}));
    g.appendChild(el("circle", {"class":"avc", cx:19, cy:NH/2, r:11.5}));
    if (m.img){
      g.appendChild(el("image", {x:7.5, y:NH/2 - 11.5, width:23, height:23, href:m.img, "clip-path":"url(#avclip)", preserveAspectRatio:"xMidYMid slice"}));
    } else {
      var avt = el("text", {"class":"avt", x:19, y:NH/2 + 4.5}); avt.textContent = m.name.charAt(0); g.appendChild(avt);
    }
    var nm = el("text", {"class":"nm", x:38, y:23}); nm.textContent = m.name; g.appendChild(nm);
    var yr = el("text", {"class":"yr", x:38, y:40});
    yr.textContent = (m.byear == null && m.dyear == null) ? "" : (m.byear == null ? "？" : m.byear) + " – " + (m.dyear == null ? (m.alive ? "存命" : "？") : m.dyear);
    g.appendChild(yr);
    g.addEventListener("click", function(){ selectPerson(m.id); });
    nodes.appendChild(g);
  });
}

/* ========= パン・ズーム ========= */
function applyView(){ viewport.setAttribute("transform", "translate(" + view.x + "," + view.y + ") scale(" + view.k + ")"); }
function clampK(k){ return Math.min(2.6, Math.max(0.12, k)); }
function zoomAt(px, py, f){
  var k2 = clampK(view.k * f); if (k2 === view.k) return;
  view.x = px - (px - view.x) * (k2 / view.k);
  view.y = py - (py - view.y) * (k2 / view.k);
  view.k = k2; applyView();
}
canvas.addEventListener("wheel", function(e){
  e.preventDefault();
  userMoved = true;
  var r = canvas.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0016));
}, {passive:false});
var pointers = new Map(), pinch = null;
function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
canvas.addEventListener("pointerdown", function(e){
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  cancelAnim();
  if (pointers.size === 2){
    var ps = Array.from(pointers.values());
    pinch = {d:dist(ps[0], ps[1]), mx:(ps[0].x + ps[1].x)/2, my:(ps[0].y + ps[1].y)/2};
  }
});
canvas.addEventListener("pointermove", function(e){
  if (!pointers.has(e.pointerId)) return;
  var prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pointers.size === 1){
    userMoved = true;
    view.x += e.clientX - prev.x; view.y += e.clientY - prev.y; applyView();
  } else if (pointers.size === 2 && pinch){
    userMoved = true;
    var ps = Array.from(pointers.values()), r = canvas.getBoundingClientRect();
    var mx = (ps[0].x + ps[1].x)/2 - r.left, my = (ps[0].y + ps[1].y)/2 - r.top;
    view.x += mx - (pinch.mx - r.left); view.y += my - (pinch.my - r.top);
    var nd = dist(ps[0], ps[1]);
    if (pinch.d > 0) zoomAt(mx, my, nd / pinch.d); else applyView();
    pinch = {d:nd, mx:(ps[0].x + ps[1].x)/2, my:(ps[0].y + ps[1].y)/2};
  }
});
function endPointer(e){ pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; }
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
document.getElementById("zin").addEventListener("click", function(){ userMoved = true; zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1.3); });
document.getElementById("zout").addEventListener("click", function(){ userMoved = true; zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1/1.3); });
document.getElementById("zfit").addEventListener("click", function(){ userMoved = false; fitView(true); });

function animateView(target, dur){
  cancelAnim();
  var from = {x:view.x, y:view.y, k:view.k}, t0 = performance.now();
  function step(now){
    var t = Math.min(1, (now - t0) / dur), e = t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
    view = {x: from.x + (target.x - from.x) * e, y: from.y + (target.y - from.y) * e, k: from.k + (target.k - from.k) * e};
    applyView();
    if (t < 1) animId = requestAnimationFrame(step); else animId = null;
  }
  animId = requestAnimationFrame(step);
}
function cancelAnim(){ if (animId){ cancelAnimationFrame(animId); animId = null; } }
function fitTarget(){
  var b = contentBox, sw = stage.clientWidth, sh = stage.clientHeight;
  var k = Math.min(clampK(Math.min(sw / (b.maxX - b.minX), sh / (b.maxY - b.minY))), 1.2);
  return {k:k, x:(sw - (b.maxX - b.minX) * k)/2 - b.minX * k, y:(sh - (b.maxY - b.minY) * k)/2 - b.minY * k};
}
function fitView(anim){ var t = fitTarget(); if (anim) animateView(t, 700); else { view = t; applyView(); } }
/* スマホは読み込み後にブラウザUIの表示状態が変わって stage の実寸が変わる。
   手動操作していない時だけ、resize／回転に合わせて再フィットする */
var resizeTimer = null;
function refitOnResize(){
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){ if (!userMoved && contentBox) fitView(false); }, 120);
}
window.addEventListener("resize", refitOnResize);
window.addEventListener("orientationchange", refitOnResize);

function showHighlight(id){
  var old = document.querySelector(".hl-ring"); if (old) old.remove();
  if (hlTimer) clearTimeout(hlTimer);
  var p = pos[id]; if (!p) return;
  var r = el("rect", {"class":"hl-ring", x:p.x - 7, y:p.y - 7, width:NW + 14, height:NH + 14, rx:11});
  document.getElementById("nodes").appendChild(r);
  hlTimer = setTimeout(function(){ r.remove(); }, 3400);
}
function focusPerson(id){
  var p = pos[id]; if (!p) return;
  userMoved = true; /* 検索ジャンプ後の再フィットで視点が飛ばないように */
  var k = Math.max(view.k, 1.0);
  animateView({k:k, x: stage.clientWidth/2 - (p.x + NW/2) * k, y: stage.clientHeight/2 - (p.y + NH/2) * k}, 850);
  showHighlight(id);
  selectPerson(id);
}

/* ========= 詳細パネル ========= */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c]; }); }
function relList(list){
  if (!list || !list.length) return "不明";
  return list.map(function(x){
    if (byId[x]) return '<button type="button" class="rel" data-pid="' + x + '">' + esc(byId[x].name) + "</button>";
    return esc(x);
  }).join("、");
}
function parentHTML(id){ if (!id) return "不明"; if (byId[id]) return '<button type="button" class="rel" data-pid="' + id + '">' + esc(byId[id].name) + "</button>"; return esc(id); }
function siblingsOf(m){ return clan.members.filter(function(o){ return o.id !== m.id && ((m.father && o.father === m.father) || (m.mother && o.mother === m.mother)); }).map(function(o){ return o.id; }); }
function childrenOf(m){ return clan.members.filter(function(o){ return o.father === m.id || o.mother === m.id; }).map(function(o){ return o.id; }); }
function renderDetail(m){
  var d = document.getElementById("detail");
  if (!m){
    d.innerHTML = '<div class="intro-crest">' + crestSVG(clan.theme.crest) + "</div>"
      + "<h2>" + esc(clan.full) + "</h2>"
      + '<p class="note">' + esc(clan.desc) + "</p>"
      + '<p class="sub">収録 ' + clan.members.length + "人" + (clan.dummy ? "（試作ダミーデータ）" : "") + "。系図の人物をタップ／クリックすると、肖像とプロフィールがここに表示されます。名前で検索すると、その人の場所へ移動してハイライトします。</p>";
    return;
  }
  var age = (m.byear != null && m.dyear != null) ? (m.dyear - m.byear) + "歳" : "不明";
  var death = m.death || "不明";
  if (m.alive){ death = "存命"; age = "存命"; }
  var rows = [
    ["生年月日", m.birth || "不明"],
    ["出生地", m.birthplace || "不明"],
    ["家系", clan.full],
    ["死亡日", death],
    ["享年", age],
    ["死因・最期", m.fate || "不明"],
    ["配偶者", relList(m.spouses)],
    ["父", parentHTML(m.father)],
    ["母", parentHTML(m.mother)],
    ["兄弟姉妹", relList(siblingsOf(m))],
    ["子", relList(childrenOf(m))],
    ["Wikipedia", m.wiki ? '<a href="' + esc(m.wiki) + '" target="_blank" rel="noopener">記事を開く</a>' : "不明"]
  ];
  if (m.aliases && m.aliases.length){
    rows.splice(3, 0, ["別名", m.aliases.map(function(a){ return esc(a.name) + (a.source ? '<span class="src">（' + esc(a.source) + "）</span>" : ""); }).join("、")]);
  }
  if (m.enshrined && m.enshrined.length){
    var ensHtml = m.enshrined.map(function(e){
      if (typeof e === "string") return esc(e);
      return esc(e.name) + (e.note ? '<span class="src">（' + esc(e.note) + "）</span>" : "");
    }).join("、");
    rows.splice(rows.length - 1, 0, ["祀られる場所", ensHtml]);
  }
  /* 関係線の相手と内容（この人物が関わる relations） */
  var relHtml = "";
  var myRels = (clan.relations || []).filter(function(r){ return r.from === m.id || r.to === m.id; });
  if (myRels.length){
    relHtml = '<div class="relsec"><h3>関係</h3>' + myRels.map(function(r){
      var otherId = r.from === m.id ? r.to : r.from;
      var tag = r.sourceAlt ? "古史古伝：" + r.sourceAlt
        : r.kind === "lineage" ? "古典の系譜" + (r.source ? "（" + r.source + "）" : "")
        : r.kind === "sequence" ? "出現順" + (r.source ? "（" + r.source + "）" : "")
        : r.kind === "identity" ? "同一神の伝" + (r.source ? "（" + r.source + "）" : "") : "";
      return '<div class="ritem">' + parentHTML(otherId) + " ― " + esc(r.label || "")
        + (tag ? '<span class="tag">' + esc(tag) + "</span>" : "") + "</div>";
    }).join("") + "</div>";
  }
  /* 古史古伝の異説（出典ごとに色分け） */
  var altHtml = "";
  if (m.alt && m.alt.length){
    altHtml = '<div class="altsec"><h3>古史古伝の異説</h3>' + m.alt.map(function(a){
      var c = altColor(a.source);
      return '<div class="aitem" style="border-left-color:' + c + '"><span class="altsrc" style="background:' + c + '">' + esc(a.source) + "</span>" + esc(a.text) + "</div>";
    }).join("") + "</div>";
  }
  var av = m.img ? '<img src="' + esc(m.img) + '" alt="">' : esc(m.name.charAt(0));
  d.innerHTML = '<div class="avatar">' + av + "</div>"
    + "<h2>" + esc(m.name) + (m.kana ? '<span class="kana">（' + esc(m.kana) + "）</span>" : "") + "</h2>"
    + (m.title ? '<p class="ttl">' + esc(m.title) + "</p>" : "")
    + (m.note ? '<p class="sub" style="margin:0 0 6px">' + esc(m.note) + "</p>" : "")
    + rows.map(function(r){ return '<div class="drow"><b>' + r[0] + '</b><span class="v">' + r[1] + "</span></div>"; }).join("")
    + relHtml + altHtml;
  d.querySelectorAll(".rel").forEach(function(b){ b.addEventListener("click", function(){ focusPerson(b.dataset.pid); }); });
  d.scrollTop = 0;
}
function selectPerson(id){
  selectedId = id;
  document.querySelectorAll(".node").forEach(function(n){ n.classList.toggle("sel", n.dataset.id === id); });
  renderDetail(byId[id]);
  /* モバイルでは詳細パネルがキャンバスの下にあって気づきにくいので、見える位置までスクロールする */
  if (window.matchMedia("(max-width: 820px)").matches){
    var d = document.getElementById("detail");
    requestAnimationFrame(function(){ d.scrollIntoView({behavior:"smooth", block:"start"}); });
  }
}

/* ========= 家系切替・検索 ========= */
function setClan(id){
  clan = CLANS.find(function(c){ return c.id === id; });
  selectedId = null;
  userMoved = false;
  applyTheme(clan.theme);
  document.getElementById("clanDesc").textContent = clan.full + " ― " + clan.desc;
  document.querySelectorAll("#clanTabs button").forEach(function(b){ b.classList.toggle("on", b.dataset.clan === id); });
  buildLayout(); render(); renderDetail(null); fitView(false); buildLegend();
}
/* ========= 凡例（線の種類と出典色） ========= */
function lgSwatch(color, dash, dbl){
  var inner = dbl
    ? '<line x1="1" y1="2.4" x2="33" y2="2.4"/><line x1="1" y1="5.6" x2="33" y2="5.6"/>'
    : '<line x1="1" y1="4" x2="33" y2="4"' + (dash ? ' stroke-dasharray="' + dash + '"' : "") + "/>";
  return '<svg width="34" height="8" viewBox="0 0 34 8" stroke="' + color + '" stroke-width="1.6">' + inner + "</svg>";
}
function buildLegend(){
  var lg = document.getElementById("legend");
  var kinds = {}, alts = {};
  (clan.relations || []).forEach(function(r){
    if (r.sourceAlt) alts[r.sourceAlt] = 1;
    else kinds[r.kind || "plain"] = 1;
  });
  var items = [];
  items.push("<li>" + lgSwatch("#8a7a52", null, false) + "親子</li>");
  items.push("<li>" + lgSwatch("#8a7a52", null, true) + "配偶者</li>");
  if (kinds.lineage) items.push("<li>" + lgSwatch("#a07c2c", "8 4", false) + "古典の系譜</li>");
  if (kinds.sequence) items.push("<li>" + lgSwatch("#5b7aa5", "1.5 4", false) + "出現順（矢印の向きに成った）</li>");
  if (kinds.identity) items.push("<li>" + lgSwatch("#a07c2c", "6 3 1.5 3", false) + "同一神の伝</li>");
  if (kinds.plain) items.push("<li>" + lgSwatch("#8a7a52", "2.5 4", false) + "関係</li>");
  Object.keys(alts).forEach(function(s){ items.push("<li>" + lgSwatch(altColor(s), "5 3", false) + "古史古伝の関係線（" + esc(s) + "）</li>"); });
  if (clan.members.some(function(m){ return m.alt && m.alt.length; })) items.push('<li style="display:block;color:var(--mut)">詳細パネルの「古史古伝の異説」も出典ごとに色分けしています</li>');
  lg.innerHTML = '<button type="button" class="lg-title" id="lgToggle">凡例</button><ul>' + items.join("") + "</ul>";
  lg.hidden = false;
  lg.classList.toggle("closed", window.matchMedia("(max-width: 820px)").matches);
  document.getElementById("lgToggle").addEventListener("click", function(){ lg.classList.toggle("closed"); });
}
var tabs = document.getElementById("clanTabs");
CLANS.forEach(function(c){
  var b = document.createElement("button");
  b.type = "button"; b.textContent = c.name; b.dataset.clan = c.id;
  b.addEventListener("click", function(){ setClan(c.id); });
  tabs.appendChild(b);
});
var sInput = document.getElementById("searchInput"), cand = document.getElementById("candidates");
/* 検索の表記ゆれ吸収：ひらがな→カタカナ、ヅ→ジ・ヂ→ジ、歴史的仮名遣い（ヰヱヲ）を寄せる */
function normName(s){
  return String(s == null ? "" : s)
    .replace(/[ぁ-ゖ]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0) + 0x60); })
    .replace(/ヅ/g, "ジ").replace(/ヂ/g, "ジ")
    .replace(/ヰ/g, "イ").replace(/ヱ/g, "エ").replace(/ヲ/g, "オ")
    .replace(/\s+/g, "");
}
function nameMatches(m, nq){
  if (!nq) return false;
  if (normName(m.name).indexOf(nq) >= 0) return true;
  if (m.kana && normName(m.kana).indexOf(nq) >= 0) return true;
  if (m.title && normName(m.title).indexOf(nq) >= 0) return true;
  return (m.aliases || []).some(function(a){ return normName(a.name).indexOf(nq) >= 0; });
}
sInput.addEventListener("input", function(){
  var q = sInput.value.trim();
  if (!q){ cand.style.display = "none"; cand.innerHTML = ""; return; }
  var nq = normName(q);
  var hits = [];
  CLANS.forEach(function(c){ c.members.forEach(function(m){ if (nameMatches(m, nq)) hits.push({clan:c, m:m}); }); });
  cand.innerHTML = "";
  if (!hits.length){
    cand.innerHTML = '<div style="padding:9px 11px;font-size:12.5px;color:var(--mut)">一致する人物はいません</div>';
    cand.style.display = "block"; return;
  }
  hits.slice(0, 14).forEach(function(h){
    var b = document.createElement("button"); b.type = "button";
    b.innerHTML = '<span class="cn"></span><span class="cm"></span>';
    b.querySelector(".cn").textContent = h.m.name;
    b.querySelector(".cm").textContent = h.clan.name + (h.m.kana ? "｜" + h.m.kana : "") + "｜" + (h.m.byear == null ? "？" : h.m.byear) + "–" + (h.m.dyear == null ? "" : h.m.dyear);
    b.addEventListener("click", function(){
      cand.style.display = "none"; sInput.value = h.m.name;
      if (h.clan.id !== clan.id) setClan(h.clan.id);
      focusPerson(h.m.id);
    });
    cand.appendChild(b);
  });
  cand.style.display = "block";
});
document.addEventListener("click", function(e){ if (!e.target.closest(".search")) cand.style.display = "none"; });
sInput.addEventListener("keydown", function(e){ if (e.key === "Enter"){ var f = cand.querySelector("button"); if (f) f.click(); } });

setClan("genji");
</script>
