<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>家系図（系図モード試作） | 歴史人物名鑑</title>
<meta name="description" content="家系図の新しい表示方式「系図モード」の試作。直交配線とグループ枠で、神々・源氏・平家の系図を一枚に収める。">
<style>
:root{
  --bg:linear-gradient(180deg,#fbf9f3,#efe8d8);
  --ink:#22304d; --mut:#6d7484;
  --accent:#27436e; --accent-soft:rgba(39,67,110,.10);
  --panel:rgba(255,255,255,.88); --panel-line:rgba(39,67,110,.32);
  --node-bg:#fffdf6; --node-line:#33507e; --node-text:#22304d;
  --edge:rgba(39,67,110,.5);
  --highlight:#a37f36; --header-bg:rgba(250,248,242,.92);
  --crest-color:#27436e;
  --serif:"Hiragino Mincho ProN","Hiragino Mincho Pro","YuMincho","Yu Mincho","Noto Serif JP","MS PMincho",serif;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--bg); background-color:#f4efe2;
  min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; overflow-x:hidden;
  transition:background-color .8s ease, color .6s ease;
}
header, .card, button, input, aside, .zoomctl button, .hint{
  transition:background-color .8s ease, background .8s ease, color .6s ease, border-color .8s ease;
}
/* ---------- サイトバー（他ページ共通部品をこのページの色に合わせたもの） ---------- */
.sitebar{background:var(--header-bg);border-bottom:1px solid var(--panel-line);}
.sitebar .sb-in{max-width:1180px;margin:0 auto;padding:7px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.sitebar a{color:var(--ink);text-decoration:none;font-size:13px;letter-spacing:.14em;transition:color .8s ease;padding:6px 2px;}
.sitebar a:hover{color:var(--accent);}
.sitebar .sb-name{font-family:var(--serif);font-weight:600;}
.sitebar .sb-tool{color:var(--mut);font-size:12px;letter-spacing:.2em;}
header{
  background:var(--header-bg); border-bottom:1px solid var(--panel-line);
  padding:10px 16px 12px; position:relative; z-index:30;
  backdrop-filter:blur(6px);
}
.hd-row{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; max-width:1400px; margin:0 auto}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand .crest{width:34px; height:34px; color:var(--accent); flex:none; transition:color .8s ease}
.brand .crest svg{width:100%; height:100%; display:block}
h1{font-family:var(--serif); font-size:24px; letter-spacing:.28em; margin:0; font-weight:600; white-space:nowrap}
h1 .mode{font-size:12px; letter-spacing:.1em; color:var(--accent); vertical-align:middle; border:1px solid var(--accent); border-radius:999px; padding:2px 9px; margin-left:10px; white-space:nowrap}
.clan-desc{margin:2px 0 0; font-size:11.5px; color:var(--mut); letter-spacing:.04em}
.clan-tabs{display:flex; gap:6px; flex-wrap:wrap}
.clan-label{
  font-family:var(--serif); font-size:13px; letter-spacing:.18em; color:var(--mut);
  align-self:center; flex:none; margin-right:2px;
}
.clan-tabs button{
  font-family:var(--serif); font-size:15px; font-weight:600; letter-spacing:.14em;
  background:var(--panel); color:var(--ink); border:1.5px solid var(--accent);
  padding:8px 20px; border-radius:999px; cursor:pointer;
}
.clan-tabs button.on{background:var(--accent); color:#fff; border-color:var(--accent)}
html[data-clan="heike"] .clan-tabs button.on{color:#1c0a05}
.search{position:relative; margin-left:auto}
.search input{
  width:min(300px,72vw); padding:9px 13px; font-size:14px; font-family:var(--sans);
  background:var(--panel); color:var(--ink); border:1px solid var(--panel-line); border-radius:8px; outline:none;
}
.search input::placeholder{color:var(--mut)}
#candidates{
  position:absolute; top:calc(100% + 6px); right:0; width:min(320px,84vw); max-height:320px; overflow:auto;
  background:var(--panel); border:1px solid var(--panel-line); border-radius:10px; padding:5px; display:none; z-index:50;
  box-shadow:0 14px 34px rgba(0,0,0,.25);
}
#candidates button{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px; width:100%;
  background:transparent; border:0; border-radius:7px; padding:8px 10px; cursor:pointer; color:var(--ink); text-align:left;
}
#candidates button:hover{background:var(--accent-soft)}
#candidates .cn{font-family:var(--serif); font-size:14.5px}
#candidates .cm{font-size:11px; color:var(--mut); white-space:nowrap}
main{flex:1; display:flex; gap:0; max-width:1400px; width:100%; margin:0 auto; min-height:0}
#stage{
  position:relative; flex:1; min-width:0; height:calc(100vh - 190px); height:calc(100dvh - 190px); min-height:480px; overflow:hidden;
}
#watermark{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  pointer-events:none; z-index:0; transition:color .8s ease, opacity .8s ease;
}
#watermark svg{width:min(58vh,480px); height:auto; display:block}
#canvas{position:absolute; inset:0; width:100%; height:100%; z-index:1; touch-action:none; cursor:grab}
#canvas:active{cursor:grabbing}
.zoomctl{position:absolute; left:calc(14px + env(safe-area-inset-left, 0px)); bottom:calc(14px + env(safe-area-inset-bottom, 0px)); z-index:5; display:flex; gap:6px}
.zoomctl button{
  min-width:42px; height:38px; padding:0 12px; font-size:16px; cursor:pointer;
  background:var(--panel); color:var(--ink); border:1px solid var(--panel-line); border-radius:9px;
}
.hint{
  position:absolute; right:calc(14px + env(safe-area-inset-right, 0px)); bottom:calc(14px + env(safe-area-inset-bottom, 0px)); z-index:5; font-size:11px; color:var(--mut);
  background:var(--panel); border:1px solid var(--panel-line); border-radius:999px; padding:5px 12px;
}
/* ===== 系図SVG ===== */
#edges path{stroke:var(--edge); fill:none; stroke-width:1.3; transition:stroke .8s ease}
#edges path.spouse{stroke-width:1.1}
.node{cursor:pointer}
.node rect.card{fill:var(--node-bg); stroke:var(--node-line); stroke-width:1.2; transition:fill .8s ease, stroke .8s ease}
.node.sel rect.card{stroke:var(--highlight); stroke-width:2.4}
.node text{pointer-events:none}
.node .nm{font-family:var(--serif); font-size:13.5px; font-weight:600; fill:var(--node-text); transition:fill .8s ease}
.node .yr{font-size:10.5px; fill:var(--mut); transition:fill .8s ease}
.node .avc{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1; transition:fill .8s ease, stroke .8s ease}
.node .avt{font-family:var(--serif); font-size:12px; fill:var(--accent); text-anchor:middle; transition:fill .8s ease}
.hl-ring{fill:none; stroke:var(--highlight); stroke-width:2.6; pointer-events:none; animation:hlpulse 1.05s ease-in-out infinite}
@keyframes hlpulse{0%,100%{opacity:1}50%{opacity:.3}}
#relations path{fill:none; stroke-width:1.2}
.rel-label{
  font-size:10px; pointer-events:none;
  paint-order:stroke; stroke:var(--panel); stroke-width:3.5px; stroke-linejoin:round;
}
#legend{
  position:absolute; left:calc(14px + env(safe-area-inset-left, 0px)); top:12px; z-index:6;
  background:var(--panel); border:1px solid var(--panel-line); border-radius:10px;
  padding:8px 12px 9px; font-size:11px; line-height:1.5; color:var(--ink); max-width:230px;
}
#legend .lg-title{font-family:var(--serif); font-size:11.5px; letter-spacing:.14em; color:var(--mut); cursor:pointer; background:none; border:0; padding:0; font-weight:600}
#legend ul{list-style:none; margin:5px 0 0; padding:0}
#legend li{display:flex; align-items:center; gap:8px; margin:2.5px 0}
#legend svg{flex:none}
#legend.closed ul{display:none}
/* ===== 系図モード：ブロック・枠・チップ ===== */
.block-band{fill:var(--accent-soft); stroke:var(--panel-line); stroke-width:1.2}
.block-label{font-family:var(--serif); font-size:15px; font-weight:700; letter-spacing:.14em; fill:var(--ink)}
.block-sub{font-size:11px; fill:var(--mut)}
.block-toggle{font-size:11.5px; font-weight:700; fill:var(--accent); text-anchor:end}
.block-head{cursor:pointer}
.hit{fill:transparent}
.node .avring{fill:none; stroke:var(--accent); stroke-width:1}
#edges line.edge-spouse{stroke:var(--edge); stroke-width:1.1}
.hlrect{fill:none; stroke:var(--highlight); stroke-width:2.6; pointer-events:none; animation:hlpulse 1.05s ease-in-out infinite}
#legend .lg{display:flex; align-items:center; gap:8px; margin:2.5px 0}
#legend .sw{display:inline-block; width:26px; flex:none}
#legend .sw.line{border-top:2px solid var(--edge)}
#legend .sw.dbl{height:5px; border-top:1.6px solid var(--edge); border-bottom:1.6px solid var(--edge)}
#legend .sw.frame{height:13px; border:1.2px solid var(--panel-line); background:rgba(128,105,40,.055); border-radius:3px}
#legend .sw.chipsw{height:13px; border:1.3px solid var(--accent); border-radius:7px; background:var(--panel)}
aside dl{margin:0}
aside dt{font-family:var(--serif); font-size:12px; font-weight:600; color:var(--mut); letter-spacing:.06em; margin:9px 0 0}
aside dd{margin:2px 0 0; padding:0 0 8px; font-size:13.5px; line-height:1.55; border-bottom:1px solid var(--panel-line)}
aside .blkrow{margin:0; padding:4px 0; border-bottom:1px solid var(--panel-line); font-size:13px}
aside .relrow{margin:0; padding:5px 0; border-bottom:1px solid var(--panel-line); font-size:13px; line-height:1.55}
aside .relchip{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.05em; padding:0 7px; border:1px solid; border-radius:999px; margin-right:7px; white-space:nowrap}
aside .altbox{border-left:3px solid var(--mut); padding:5px 0 5px 10px; margin:7px 0; font-size:12.5px; line-height:1.7}
aside .altbox p{margin:4px 0 0}
aside .alt-src{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.05em; color:#fff; padding:0 7px; border-radius:999px; margin-right:7px; white-space:nowrap}
aside p a{color:var(--accent)}
.frame-rect{fill:rgba(128,105,40,.055); stroke:var(--panel-line); stroke-width:1.2}
.frame-label{
  font-family:var(--serif); font-size:12.5px; font-weight:700; letter-spacing:.12em; fill:var(--accent);
  paint-order:stroke; stroke:var(--panel); stroke-width:3px; stroke-linejoin:round;
}
.frame-head{cursor:pointer}
.chip{cursor:pointer}
.chip rect{fill:var(--panel); stroke:var(--accent); stroke-width:1.3}
.chip text{font-size:11.5px; font-weight:600; fill:var(--accent); text-anchor:middle}
.chip.gchip rect{stroke-dasharray:5 3}
.chip .cnt{font-weight:400; fill:var(--mut)}
/* ===== 詳細パネル ===== */
aside{
  width:330px; flex:none; border-left:1px solid var(--panel-line); background:var(--panel);
  padding:18px 18px 24px; overflow:auto; max-height:calc(100vh - 190px); max-height:calc(100dvh - 190px);
}
aside h2{font-family:var(--serif); font-size:21px; letter-spacing:.1em; margin:0 0 2px}
aside .ttl{font-size:12px; color:var(--accent); letter-spacing:.12em; margin:0 0 10px}
aside .avatar{
  width:74px; height:74px; border-radius:50%; margin:4px 0 12px;
  border:1.5px solid var(--accent); background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  font-family:var(--serif); font-size:30px;
}
aside .avatar img{width:100%; height:100%; object-fit:cover}
aside .portrait{
  width:100%; max-height:250px; object-fit:contain; display:block;
  margin:2px 0 4px; background:rgba(0,0,0,.045); border-radius:6px;
}
aside .imgcredit{font-size:11px; color:var(--mut); line-height:1.65; margin:0 0 10px}
aside .imgcredit a{color:var(--accent)}
aside h2 .kana{font-size:12.5px; color:var(--mut); letter-spacing:.05em; font-weight:400}
.drow{display:flex; gap:10px; padding:7.5px 0; border-bottom:1px solid var(--panel-line); font-size:13.5px; line-height:1.55}
.drow b{flex:none; width:70px; font-family:var(--serif); font-weight:600; color:var(--mut); letter-spacing:.06em}
.drow .v{min-width:0}
.drow a{color:var(--accent)}
.rel{
  background:none; border:0; padding:0; font:inherit; color:var(--accent); cursor:pointer;
  text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--panel-line);
}
.intro-crest{width:64px; height:64px; color:var(--accent); margin:2px 0 10px; transition:color .8s ease}
.intro-crest svg{width:100%; height:100%; display:block}
aside p.note{font-size:13px; line-height:1.8; color:var(--ink)}
aside p.sub{font-size:12px; color:var(--mut); line-height:1.7}
aside h3{font-family:var(--serif); font-size:13.5px; letter-spacing:.12em; color:var(--mut); margin:16px 0 6px; font-weight:600}
aside .blklist{list-style:none; margin:6px 0 0; padding:0}
aside .blklist li{padding:4px 0; border-bottom:1px solid var(--panel-line); font-size:13px}
.drow .src, .relsec .src{color:var(--mut); font-size:11px}
.relsec .ritem{padding:5px 0; border-bottom:1px solid var(--panel-line); font-size:13px; line-height:1.55}
.relsec .tag{
  display:inline-block; font-size:10px; letter-spacing:.06em; padding:0 6px; margin-left:6px;
  border:1px solid var(--panel-line); border-radius:999px; color:var(--mut); vertical-align:1px; white-space:nowrap;
}
.altsec .aitem{
  border-left:3px solid var(--mut); padding:5px 0 5px 10px; margin:7px 0;
  font-size:12.5px; line-height:1.7;
}
.altsrc{
  display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.05em; color:#fff;
  padding:0 7px; border-radius:999px; margin-right:7px; vertical-align:1px; white-space:nowrap;
}
footer{
  border-top:1px solid var(--panel-line); padding:12px 16px calc(16px + env(safe-area-inset-bottom, 0px)); text-align:center;
  font-size:11px; color:var(--mut); line-height:1.8; background:var(--header-bg);
}
@media (max-width:820px){
  header{padding:8px 12px 10px}
  .hd-row{gap:8px 10px}
  .brand .crest{width:28px; height:28px}
  h1{font-size:20px}
  .clan-desc{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .clan-tabs{order:1; flex:1 1 100%; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:2px}
  .clan-tabs::-webkit-scrollbar{display:none}
  .clan-tabs button{flex:none}
  .search{order:2; flex:1 1 100%; margin-left:0}
  .search input{width:100%}
  #candidates{left:0; right:0; width:auto}
  main{flex-direction:column}
  #stage{height:62vh; height:62dvh; min-height:420px; flex:none}
  aside{width:auto; border-left:0; border-top:1px solid var(--panel-line); max-height:none}
}
</style>
</head>
<body>
<div class="sitebar"><div class="sb-in"><a class="sb-name" href="index.html">歴史系ツール集</a><span style="display:flex;align-items:center;gap:12px;"><a href="https://wankodo.github.io/">よろず道具箱</a><span class="sb-tool">家系図（系図モード試作）</span></span></div></div>
<header>
  <div class="hd-row">
    <div class="brand">
      <span class="crest" id="brandCrest"></span>
      <div>
        <h1>家系図<span class="mode">系図モード試作</span></h1>
        <p class="clan-desc" id="clanDesc"></p>
      </div>
    </div>
    <nav class="clan-tabs" id="clanTabs" aria-label="家系の選択"><span class="clan-label">家系</span></nav>
    <div class="search">
      <input id="searchInput" type="text" placeholder="名前で検索（例：義経、よしつね）" autocomplete="off">
      <div id="candidates"></div>
    </div>
  </div>
</header>
<main>
  <section id="stage">
    <div id="watermark"></div>
    <svg id="canvas" aria-label="家系図キャンバス">
      <defs><clipPath id="avclip"><circle cx="0" cy="0" r="11"/></clipPath><marker id="seqArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#5b7aa5"/></marker></defs>
      <g id="viewport">
        <g id="blocks"></g>
        <g id="frames"></g>
        <g id="edges"></g>
        <g id="relations"></g>
        <g id="nodes"></g>
        <g id="ui"></g>
      </g>
    </svg>
    <div class="zoomctl">
      <button id="zin" type="button" title="拡大">＋</button>
      <button id="zout" type="button" title="縮小">−</button>
      <button id="zfit" type="button" title="全体表示">全体</button>
    </div>
    <div id="legend" hidden></div>
    <div class="hint">ドラッグで移動／ホイール・ピンチで拡大縮小</div>
  </section>
  <aside id="detail"></aside>
</main>
<footer>
  これは表示方式の試作ページです。通常版の家系図は genealogy.html にあります。<br>

/* ========= 配置 ========= */

  var cy = y, placed = [];
  rows.forEach(function(row){
    var ix = areaX + (areaW - (multi ? GUT : 0) - row.w) / 2;
    row.items.forEach(function(it){
      it._x = ix; it._y = cy;
      if (it.type === "unit") placeUnit(it.uid, ix, cy);
      else chipDraws.push({x: ix, y: cy, w: it.w, h: it.h, item: it});

    var body = null;

/* ========= 描画 ========= */

/* ========= 検索（通常版と同じ正規化） ========= */
function normName(s){
  return String(s || "").toUpperCase().replace(/[ぁ-ん]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) + 0x60); })
    .replace(/[ヅ]/g, "ジ").replace(/[ヂ]/g, "ジ").replace(/[ヰ]/g, "イ").replace(/[ヱ]/g, "エ").replace(/[ヲ]/g, "オ")
    .replace(/[ァィゥェォッャュョヮ]/g, function(c){ return {"ァ":"ア","ィ":"イ","ゥ":"ウ","ェ":"エ","ォ":"オ","ッ":"ツ","ャ":"ヤ","ュ":"ユ","ョ":"ヨ","ヮ":"ワ"}[c]; })
    .replace(/ー/g, "").replace(/[\s　・=＝-]/g, "");
}
function nameMatches(m, q){
  var nq = normName(q); if (!nq) return false;
  var targets = [m.name, m.kana].concat(m.aliases || []);
  return targets.some(function(t){ var nt = normName(t); return nt && (nt.indexOf(nq) >= 0 || nq.indexOf(nt) >= 0); });
}

  candBox.innerHTML = hits.slice(0, 14).map(function(h){
    return '<button class="cand" data-clan="' + esc(h.clan.id) + '" data-id="' + esc(h.m.id) + '"><span class="cn">' + esc(h.m.name) + '</span><span class="cm">' + esc(h.m.kana || "") + '</span><span class="cm">' + esc(h.clan.short || h.clan.name) + "</span></button>";
  }).join("") + (hits.length > 14 ? '<div class="more">ほか ' + (hits.length - 14) + " 件</div>" : "");
  candBox.querySelectorAll(".cand").forEach(function(b){ b.addEventListener("click", function(){ candBox.innerHTML = ""; if (b.dataset.clan !== clan.id) setClan(b.dataset.clan); focusPerson(b.dataset.id); }); });
}

/* ========= パン・ズーム（通常版から流用） ========= */
function clampK(k){ return Math.min(2.6, Math.max(0.12, k)); }
function applyView(){ viewport.setAttribute("transform", "translate(" + view.x + "," + view.y + ") scale(" + view.k + ")"); }
function cancelAnim(){ if (animId != null){ cancelAnimationFrame(animId); animId = null; } }
function animateView(to, done){
  cancelAnim();
  var from = {x: view.x, y: view.y, k: view.k}, t0 = performance.now(), dur = 650;
  function step(t){
    var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    view = {x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e, k: from.k + (to.k - from.k) * e};
    applyView();
    if (p < 1) animId = requestAnimationFrame(step); else { animId = null; if (done) done(); }
  }
  animId = requestAnimationFrame(step);
}
function zoomAt(cx, cy, factor){
  var k2 = clampK(view.k * factor);
  view = {x: cx - (cx - view.x) * (k2 / view.k), y: cy - (cy - view.y) * (k2 / view.k), k: k2};
  applyView();
}
function fitTarget(){
  var w = Math.max(1, contentBox.maxX - contentBox.minX), h = Math.max(1, contentBox.maxY - contentBox.minY);
  var k = clampK(Math.min(stage.clientWidth / w, stage.clientHeight / h) * 0.98);
  return {x: (stage.clientWidth - w * k) / 2 - contentBox.minX * k, y: 14 - contentBox.minY * k, k: k};
}
function fitView(anim){ var t = fitTarget(); if (anim) animateView(t); else { view = t; applyView(); } }
function centerOn(wx, wy, k){
  k = clampK(k || view.k);
  animateView({x: stage.clientWidth / 2 - wx * k, y: stage.clientHeight / 2 - wy * k, k: k});
}
var resizeTimer = null;
window.addEventListener("resize", function(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(function(){ if (!userMoved) fitView(false); }, 180); });
stage.addEventListener("wheel", function(ev){ ev.preventDefault(); userMoved = true; cancelAnim(); var r = stage.getBoundingClientRect(); zoomAt(ev.clientX - r.left, ev.clientY - r.top, ev.deltaY < 0 ? 1.13 : 1 / 1.13); }, {passive: false});
var pointers = new Map(), dragMoved = false;
stage.addEventListener("pointerdown", function(ev){ cancelAnim(); pointers.set(ev.pointerId, {x: ev.clientX, y: ev.clientY}); dragMoved = false; stage.setPointerCapture(ev.pointerId); });
stage.addEventListener("pointermove", function(ev){
  if (!pointers.has(ev.pointerId)) return;
  var prev = pointers.get(ev.pointerId); pointers.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
  if (pointers.size === 1){
    var dx = ev.clientX - prev.x, dy = ev.clientY - prev.y;
    if (Math.abs(dx) + Math.abs(dy) > 0){ dragMoved = true; userMoved = true; }
    view.x += dx; view.y += dy; applyView();
  } else if (pointers.size === 2){
    var pts = Array.from(pointers.values());
    var r = stage.getBoundingClientRect();
    var cx = (pts[0].x + pts[1].x) / 2 - r.left, cy = (pts[0].y + pts[1].y) / 2 - r.top;
    var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (stage._pd && d > 0) zoomAt(cx, cy, d / stage._pd);
    stage._pd = d; dragMoved = true; userMoved = true;
  }
});
function endPointer(ev){ pointers.delete(ev.pointerId); if (pointers.size < 2) stage._pd = null; }
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);
stage.addEventListener("click", function(){ if (!dragMoved){ selectedId = null; render(); renderDetail(null); } dragMoved = false; });
document.getElementById("zin").addEventListener("click", function(){ userMoved = true; zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1.3); });
document.getElementById("zout").addEventListener("click", function(){ userMoved = true; zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1 / 1.3); });
document.getElementById("zfit").addEventListener("click", function(){ userMoved = false; fitView(true); });
function showHighlight(id){

  document.querySelectorAll(".clantab").forEach(function(t){ t.classList.toggle("on", t.dataset.clan === clan.id); });
  document.getElementById("clanDesc").textContent = clan.desc || "";
  buildUnits(); buildChartRegistry(); layoutAll(); render(); renderDetail(null); buildLegend();
  applyTheme(clan.theme);
  fitView(false);
}
var tabsBox = document.getElementById("clanTabs");
tabsBox.insertAdjacentHTML("beforeend", CLANS.map(function(c){ return '<button class="clantab" type="button" data-clan="' + esc(c.id) + '">' + esc(c.short || c.name) + "</button>"; }).join(""));
tabsBox.querySelectorAll(".clantab").forEach(function(t){ t.addEventListener("click", function(){ setClan(t.dataset.clan); }); });
setClan("kami");
</script>
</body>
